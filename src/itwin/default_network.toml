# Synthetic demo corridor. Not a model of any real road: geometry, demand and
# plaza service rates are illustrative assumptions and can be changed here.
name = "Demo elevated expressway (synthetic)"
step_seconds = 10
downstream_capacity_vph = 4000   # 2-lane descent to the city street at the end
capacity_drop = 0.08             # discharge loss once a merge bottleneck is congested

[cells]
count = 24
length_km = 0.5
lanes = 3
free_flow_kmh = 80
capacity_vphpl = 2000
jam_density_vpkpl = 150
lanes_override = { "22" = 2, "23" = 2 }

[[entries]]
id = "E0"
name = "Entry A (mainline plaza)"
boundary = 0
ramp_capacity_vph = 6000
max_queue_veh = 400
plaza = { etc_lanes = 3, manual_lanes = 6, etc_service_vphpl = 1000, manual_service_vphpl = 350, etc_share = 0.55 }

